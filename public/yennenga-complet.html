<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yennenga — conte interactif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Hallmark · macrostructure: Single-object stage (bespoke) · genre: atmospheric · theme: custom
 * vibe: "veillée, feu de bois, pagne, conte pour enfants" · paper oklch(15% 0.01 50) · accent oklch(68% 0.16 45) ember
 * display: Fraunces · body: Hanken Grotesk · mono: JetBrains Mono · design-system: story.pen (Voix du Faso)
 * pre-emit critique: P5 H4 E4 S5 R4 V5
 */
:root{
  --color-night:#0E0B09; --color-night-2:#1A140F; --color-cream:#F2E6D3; --color-cream-dim:#F2E6D3B3; --color-cream-faint:#F2E6D333;
  --color-ember:#E8743B; --color-ochre:#E0A84B; --color-laterite:#C4552D; --color-indigo:#2B3A67;
  --color-ink:#2A1D14; --color-ink-soft:#2A1D1480; --color-page:#EBC2A8; --color-focus:#F2E6D3;
  --font-display:"Fraunces",Georgia,serif; --font-ui:"Hanken Grotesk",system-ui,sans-serif; --font-mono:"JetBrains Mono",ui-monospace,monospace;
  --space-xs:.5rem; --space-sm:.75rem; --space-md:1.25rem; --space-lg:2rem; --space-xl:3rem;
  --radius-stage:clamp(20px,3vw,40px); --radius-pill:999px;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-io:cubic-bezier(.65,0,.35,1);
  --dur-pose:900ms; --dur-short:220ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;overflow:hidden;background:transparent;color:var(--color-cream);font-family:var(--font-ui);width:100%;height:100%}
body{width:100%;height:100vh;display:grid;grid-template-columns:1fr 1fr;gap:0;overflow:hidden;background:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--color-focus);outline-offset:3px}

.bar{display:none}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:20px;white-space:nowrap}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--color-ember);box-shadow:0 0 14px var(--color-ember)}
.voice{display:flex;gap:2px;padding:3px;border-radius:var(--radius-pill);background:#F2E6D314;border:1px solid #F2E6D31F}
.voice button{border:0;background:transparent;padding:8px 14px;border-radius:var(--radius-pill);font-size:14px;font-weight:500;white-space:nowrap}
.voice button[aria-pressed=true]{background:var(--color-cream);color:var(--color-night);font-weight:600}
.voice button:disabled{opacity:.45;cursor:not-allowed}

main{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;height:100%}
.stagewrap{position:relative;width:100%;height:100%;border-radius:0;overflow:hidden;box-shadow:none;background:var(--color-indigo)}
#stage{width:100%;height:100%;display:block;touch-action:manipulation}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7%;gap:10px;text-align:center;transition:opacity 700ms var(--ease-io)}
.cover h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(44px,9vw,120px);line-height:.95;letter-spacing:-.03em;color:var(--color-ink)}
.cover p{margin:0;font-family:var(--font-display);font-size:clamp(17px,2.4vw,28px);color:var(--color-ink)}
.cover.gone{opacity:0;pointer-events:none}
.page{width:100%;height:100%;display:flex;flex-direction:column;gap:var(--space-md);padding:clamp(24px,3vw,40px);color:var(--color-ink);overflow:auto;
  background:repeating-linear-gradient(90deg,transparent 0 78px,#C4552D14 78px 92px,transparent 92px 96px),var(--color-page)}
.say{flex:1;margin:.4rem 0 0;font-family:var(--font-display);font-size:clamp(18px,2vw,26px);line-height:1.38}
.ctl{display:flex;align-items:center;gap:12px;margin-top:auto}
#stage{width:100%;height:100%;display:block;touch-action:manipulation}
#stage .actor{transform-box:view-box;transition:transform var(--dur-pose) var(--ease-io),opacity var(--dur-pose) var(--ease-io)}
#stage .tap{cursor:pointer}
#sky{transition:fill 1400ms var(--ease-io)}
.layer{transition:opacity 1400ms var(--ease-io)}

/* gallop: the horse bobs, the dust puffs */
.bob{animation:bob .36s var(--ease-io) infinite alternate;animation-play-state:paused;transform-box:fill-box;transform-origin:50% 100%}
.galloping .bob{animation-play-state:running}
@keyframes bob{from{transform:translateY(0) rotate(-1deg)}to{transform:translateY(-14px) rotate(1.5deg)}}
.dust circle{opacity:0}
.galloping .dust circle{animation:dust .7s linear infinite}
@keyframes dust{0%{opacity:.7;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(-90px,-30px) scale(1.4)}}

.shake{animation:shake .5s var(--ease-io) 2;transform-box:fill-box;transform-origin:50% 90%}
@keyframes shake{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.nuzzle{animation:nuzzle 1.2s var(--ease-io) 1;transform-box:fill-box;transform-origin:100% 50%}
@keyframes nuzzle{50%{transform:translateX(-18px) rotate(-3deg)}}

.plant{transform-box:fill-box;transform-origin:50% 100%;transform:scale(1,0);transition:transform 1100ms var(--ease-out),filter 1600ms var(--ease-io)}
.plant.grown{transform:scale(1,1)}
.plant.dry{transform:scale(.96,.88) rotate(9deg);filter:saturate(.15) sepia(.7) brightness(.85)}

.star{transition:transform 500ms var(--ease-out),opacity 500ms var(--ease-out);transform-box:fill-box;transform-origin:center}
.star.off{opacity:.25}
.star.on{opacity:1;transform:scale(1.5)}
.bush{transform-box:fill-box;transform-origin:50% 100%;transition:transform 600ms var(--ease-out)}
.bush.open{transform:translate(90px,10px) rotate(12deg)}

.hint{pointer-events:none;transform-box:fill-box;transform-origin:center;opacity:0;transition:opacity 300ms}
.hint.show{opacity:1;animation:ping 1.6s var(--ease-out) infinite}
@keyframes ping{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.6);opacity:0}}

.bubble{opacity:0;transition:opacity 300ms var(--ease-out),transform 400ms var(--ease-out);transform-box:fill-box;transform-origin:0 100%;transform:scale(.6)}
.bubble.show{opacity:1;transform:scale(1)}

.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7%;gap:10px;text-align:center;
  transition:opacity 700ms var(--ease-io)}
.cover h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(44px,9vw,120px);line-height:.95;letter-spacing:-.03em;color:var(--color-ink);overflow-wrap:anywhere;min-width:0}
.cover p{margin:0;font-family:var(--font-display);font-size:clamp(17px,2.4vw,28px);color:var(--color-ink)}
.cover.gone{opacity:0;pointer-events:none}

.page{width:min(100%,1180px,max(calc((100dvh - 330px)*1.7778),640px));display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-lg);align-items:center;
  padding:clamp(18px,3vw,32px) clamp(20px,3.4vw,40px);border-radius:28px;color:var(--color-ink);
  background:
   repeating-linear-gradient(90deg,transparent 0 78px,#C4552D14 78px 92px,transparent 92px 96px),
   var(--color-page)}
.chap{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;color:var(--color-laterite);text-transform:uppercase}
.say{margin:.4rem 0 0;font-family:var(--font-display);font-size:clamp(20px,2.3vw,28px);line-height:1.38;min-height:2.8em}
.say .w{transition:color 160ms,background-color 160ms;border-radius:4px}
.say .w.lit{background:#E8743B40}
.task{margin:.6rem 0 0;display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:var(--color-laterite)}
.task[hidden]{display:none}
.task svg{flex:none}
.ctl{display:flex;align-items:center;gap:12px}
.round{width:60px;height:60px;border-radius:50%;border:1.5px solid var(--color-ink-soft);background:transparent;display:grid;place-items:center;
  transition:transform var(--dur-short) var(--ease-out),background-color var(--dur-short)}
.round:active{transform:scale(.94)}
.round:disabled{opacity:.3;cursor:not-allowed}
.round.go{background:var(--color-ink);color:var(--color-page);border-color:var(--color-ink)}
.round.go.nudge{animation:nudge 1.4s var(--ease-io) infinite}
@keyframes nudge{50%{box-shadow:0 0 0 10px #2A1D1422}}
.round.listen{width:auto;padding:0 20px;border-radius:var(--radius-pill);gap:8px;display:flex;font-weight:600;white-space:nowrap}
.round.listen[aria-pressed=true]{background:#2A1D1414}

.prog{display:flex;gap:4px;width:min(100%,1180px,calc((100dvh - 330px)*1.7778))}
.prog i{height:5px;flex:1;border-radius:4px;background:#F2E6D326;transition:background-color 400ms}
.prog i.done{background:var(--color-cream)}
.prog i.now{background:var(--color-ember)}

@media (max-width:720px){
  .stagewrap{aspect-ratio:4/3}
  .page{grid-template-columns:minmax(0,1fr)}
  .ctl{justify-content:space-between}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important}
  #stage .actor,.plant,.star,.bush,.layer,#sky,.cover{transition-duration:150ms!important;transition-property:opacity,fill!important}
}
</style>
</head>

  $("#field").style.opacity=s.act==="okra"?1:0;
  $("#bushes").style.opacity=s.act==="bushes"?1:0;$("#bushes").style.pointerEvents=s.act==="bushes"?"":"none";
  $("#bubble").classList.remove("show");
  $("#cover").classList.toggle("gone",!s.cover);
  $("#chap").textContent=s.cover?"Un conte du Centre-Est":s.chap+" / 6";
  $("#say").innerHTML=s.cover?"Une légende du peuple moaga, racontée pour les petits. Prêt·e ? Appuie sur la flèche.":s.text.split(" ").map(w=>`<span class="w">${w}</span>`).join(" ");
  $("#task").hidden=!s.task||done.has(cur);$("#taskText").textContent=s.task;
  $("#next").classList.toggle("nudge",!s.task||done.has(cur));
  $("#prev").disabled=cur===0;
  $("#next").setAttribute("aria-label",cur===SCENES.length-1?"Recommencer le conte":"Page suivante");
  [...prog.children].forEach((e,i)=>{e.className=i<cur?"done":i===cur?"now":""});
  setup(s);
}

/* per-page interactions */
let taps=0;
function setup(s){
  taps=0;hideHint();
  if(done.has(cur))return;
  setTimeout(()=>{
    if(s.act==="gallop")showHint(s.rider.x+300*s.rider.s,s.rider.y+260*s.rider.s,110);
    if(s.act==="king")showHint(s.king.x+170,s.king.y+190,110);
    if(s.act==="okra")showHint(holes[0][0],holes[0][1]-30,60);
    if(s.act==="stars")showHint(starPos[0][0],starPos[0][1],50);
    if(s.act==="bushes")showHint(bushPos[0][0]+171,bushPos[0][1]+126,120);
    if(s.act==="baby")showHint(s.mother.x+360*s.mother.s,s.mother.y+100*s.mother.s,90);
  },950);
  plants.forEach(p=>p.classList.remove("grown","dry"));
  stars.forEach(g=>g.firstChild.classList.replace("on","off"));
  bushes.forEach(b=>b.classList.remove("open"));
}
function gallop(dur=2400){const r=$("#rider");if(busy)return;busy=true;r.classList.add("galloping");
  const s=SCENES[cur].rider,sx=s.x;r.style.transform=`translate(${sx+520}px,${s.y}px) scale(${s.s})`;
  setTimeout(()=>{r.style.transform=`translate(${sx}px,${s.y}px) scale(${s.s})`},dur/2);
  setTimeout(()=>{r.classList.remove("galloping");busy=false},dur)}
$("#rider").addEventListener("click",()=>{const a=SCENES[cur].act;if(a==="gallop"){gallop();complete()}else if(a!=="baby")gallop()});
$("#king").addEventListener("click",()=>{if(SCENES[cur].act!=="king")return;const k=$("#king").firstElementChild;k.classList.remove("shake");void k.getBBox();k.classList.add("shake");
  const b=$("#bubble"),p=SCENES[cur].king;$("#bubblePos").setAttribute("transform",`translate(${p.x+300} ${p.y-110})`);b.classList.add("show");complete()});
$("#field").addEventListener("click",()=>{});
$("#stage").addEventListener("click",e=>{
  if(SCENES[cur].act!=="okra"||done.has(cur))return;
  const pt=new DOMPoint(e.clientX,e.clientY).matrixTransform($("#stage").getScreenCTM().inverse());
  if(e.detail!==0&&pt.y<560)return;
  plants[taps].classList.add("grown");taps++;
  if(taps<3)showHint(holes[taps][0],holes[taps][1]-30,60);
  else{hideHint();setTimeout(()=>plants.forEach(p=>p.classList.add("dry")),1900);setTimeout(complete,2600)}
});
stars.forEach((g,i)=>g.addEventListener("click",()=>{if(SCENES[cur].act!=="stars")return;const p=g.firstChild;if(p.classList.contains("on"))return;
  p.classList.replace("off","on");const lit=stars.filter(s=>s.firstChild.classList.contains("on")).length;
  const nx=stars.find(s=>s.firstChild.classList.contains("off"));
  if(nx){const i2=stars.indexOf(nx);showHint(starPos[i2][0],starPos[i2][1],50)}
  if(lit===5){hideHint();$("#forest").style.transform="translate(-300px,0)";gallop(3000);complete()}}));
bushes.forEach((b,i)=>b.addEventListener("click",()=>{if(SCENES[cur].act!=="bushes"||done.has(cur))return;b.classList.add("open");
  const hidden=2;if(i===hidden){$("#hunter").style.transform=`translate(1060px,430px) scale(.95)`;complete()}
  else{const nx=bushes.findIndex(x=>!x.classList.contains("open"));showHint(bushPos[nx][0]+171,bushPos[nx][1]+126,120)}}));
$("#mother").addEventListener("click",()=>{if(SCENES[cur].act!=="baby")return;const m=$("#mother").firstElementChild;m.classList.remove("nuzzle");void m.getBBox();m.classList.add("nuzzle");complete()});

$("#next").addEventListener("click",()=>{cur=cur===SCENES.length-1?0:cur+1;if(cur===0)done.clear();render()});
$("#prev").addEventListener("click",()=>{if(cur>0){cur--;render()}});
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")$("#next").click();if(e.key==="ArrowLeft")$("#prev").click()});

/* read-aloud: provisional synthetic voice; the conteur's recording replaces it */
let utter=null;
function stopSpeech(){if("speechSynthesis" in window)speechSynthesis.cancel();$("#listen").setAttribute("aria-pressed","false");document.querySelectorAll(".w.lit").forEach(w=>w.classList.remove("lit"))}
$("#listen").addEventListener("click",()=>{
  if(!("speechSynthesis" in window))return;
  if($("#listen").getAttribute("aria-pressed")==="true"){stopSpeech();return}
  const txt=$("#say").textContent;utter=new SpeechSynthesisUtterance(txt);utter.lang="fr-FR";utter.rate=.9;
  const fr=speechSynthesis.getVoices().find(v=>v.lang.startsWith("fr"));if(fr)utter.voice=fr;
  const words=[...document.querySelectorAll("#say .w")];let starts=[],c=0;words.forEach(w=>{starts.push(c);c+=w.textContent.length+1});
  utter.onboundary=e=>{const i=starts.findLastIndex(s=>s<=e.charIndex);words.forEach((w,j)=>w.classList.toggle("lit",j===i))};
  utter.onend=stopSpeech;$("#listen").setAttribute("aria-pressed","true");speechSynthesis.speak(utter)});

/* keyboard: every tap target is a button too */
const label={rider:"Le cheval de Yennenga",king:"Le roi Nedega",mother:"Le cheval et le bébé"};
for(const id in label){const el=$("#"+id);el.setAttribute("role","button");el.setAttribute("aria-label",label[id])}
stars.forEach((g,i)=>{g.setAttribute("role","button");g.setAttribute("aria-label","Étoile "+(i+1))});
bushes.forEach((b,i)=>{b.setAttribute("role","button");b.setAttribute("aria-label","Buisson "+(i+1))});
function syncFocus(){const a=SCENES[cur].act;
  const on={gallop:["#rider"],king:["#king"],okra:["#ground"],stars:[...stars],bushes:[...bushes],baby:["#mother"]}[a]||[];
  document.querySelectorAll("#stage [role=button]").forEach(e=>e.setAttribute("tabindex","-1"));
  on.forEach(e=>(typeof e==="string"?$(e):e).setAttribute("tabindex","0"))}
document.addEventListener("keydown",e=>{const t=e.target;if((e.key==="Enter"||e.key===" ")&&t.closest&&t.closest("#stage [role=button]")){e.preventDefault();t.dispatchEvent(new MouseEvent("click",{bubbles:true,detail:0}))}});
const _render=render;render=()=>{_render();syncFocus()};
render();
</script>
</body>
